[project]
name = "blog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    # The posts read the study's parquets and re-score them with
    # m5_chronos2.metrics, so this environment must agree with the one that
    # produced the artifacts. numpy<2 is imposed by torch 2.2.2 on the Intel Mac
    # and kept identical on the tower; pyarrow 26 refuses to import against
    # numpy 1.x, hence the ceiling. Diverging here would make the published
    # figures incomparable with the artifacts they are read from.
    "numpy<2",
    "polars>=1.44.2",
    "pyarrow>=25.0.1,<26",
    # UMAP stack, mirroring the study's `viz` extra: notebook 10 uses the layout
    # for the visual explanation of the shape space, and post 03 reproduces it.
    # Pinned to the versions that resolve under numpy<2.
    "llvmlite==0.43.0",
    "numba==0.60.0",
    "pynndescent<0.6",
    "umap-learn>=0.5.5,<0.6",
]
